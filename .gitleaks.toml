# gitleaks config for the scan workflow (midnightntwrk/upload-sarif-github-action).
[extend]
useDefault = true

[[allowlists]]
description = "Public values in sample output: hashed bidder keys and wallet verifying keys"
regexTarget = "line"
regexes = [
  '''Bidder key:\s+[0-9a-f]{64}''',
  '''"verifyingKey":\s*"[0-9a-f]{64}"''',
]
