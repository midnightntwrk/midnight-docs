extends: substitution
message: "Use the official brand spelling '%s'."
level: error
ignorecase: true
nonword: true

swap:
  '(?<![@a-zA-Z0-9\-])\bmidnight network\b': Midnight Network
  '(?<![@a-zA-Z0-9\-])\bmidnight-network\b': Midnight Network
  '(?<![@a-zA-Z0-9\-])\bmidnightnet\b': Midnight Network
  '(?<![@a-zA-Z0-9\-])\bmidnight protocol\b': Midnight Network