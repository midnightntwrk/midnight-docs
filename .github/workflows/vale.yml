name: Vale Docs Lint

on:
  pull_request:
    paths:
      - "docs/**"
      - "**.mdx"
      - "sdks/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 22
    
      - name: Update NPM
        run: npm install -g npm@12.0.2

      - run: npm install -g mdx2vast

      - name: Run Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          reporter: github-pr-review
          filter_mode: added
          files: '["docs", "sdks"]'
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}