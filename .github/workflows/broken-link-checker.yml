name: Docs Link Checker

on:
  pull_request:
    paths:
      - "docs/**"
      - "**.md"
      - "**.mdx"

permissions:
  contents: read
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 
        with:
          files: |
            **/*.md
            **/*.mdx

      - name: Run Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 
        id: lychee
        with:
          fail: false
          args: >
            --verbose
            --include-fragments
            ${{ steps.changed.outputs.all_changed_files }}
          output: lychee/report.md

      - name: Comment broken links
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 
        with:
          path: lychee/report.md