version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

#  - package-ecosystem: "cargo"
#    directory: "/"
#    registries: "*"
#    schedule:
#      interval: "daily"
#    cooldown:
#      default-days: 7
#
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      # react-dom throws "Incompatible React versions" when react is on a
      # different version, so the build fails when only one of the two is
      # bumped (#1589, #1591). @types/react and @types/react-dom are dev-only
      # and version on their own schedule, so they stay out of the group.
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # Yarn 4.12.0 cannot install TypeScript 7 (fixed in Yarn 4.17.1), and TypeScript 7
      # rejects the baseUrl option that tsconfig.json and @docusaurus/tsconfig 3.10.2 set.
      # Remove this rule once Yarn is upgraded and TypeScript 7 accepts our tsconfig.json.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

